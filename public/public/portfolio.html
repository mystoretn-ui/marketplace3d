<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Designer Portfolio — Marketplace3D</title>

  <link rel="stylesheet" href="/portfolio.css">
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">

    <a class="logo" href="/">
      MARKETPLACE<span>3D</span>
    </a>

    <div class="topActions">
      <a href="/" class="backBtn">
        ← Back to Marketplace
      </a>

      <button id="loginBtn">
        Login
      </button>
    </div>

  </header>


  <main>

    <!-- DESIGNER PROFILE -->
    <section class="profileSection">

      <div class="avatar" id="avatar">
        3D
      </div>

      <div class="profileInfo">

        <p class="eyebrow">
          DESIGNER
        </p>

        <h1 id="designerName">
          Loading...
        </h1>

        <p
          class="username"
          id="designerUsername"
        >
          @designer
        </p>

        <p
          class="bio"
          id="designerBio"
        >
          Loading designer profile...
        </p>

        <div class="stats">

          <div class="stat">
            <strong id="modelCount">
              0
            </strong>

            <span>
              Models
            </span>
          </div>


          <div class="stat">
            <strong id="downloadCount">
              0
            </strong>

            <span>
              Downloads
            </span>
          </div>

        </div>

      </div>

    </section>


    <!-- MODELS -->
    <section class="modelsSection">

      <div class="sectionHeader">

        <div>

          <p class="eyebrow">
            COLLECTION
          </p>

          <h2>
            Models
          </h2>

        </div>

      </div>


      <div
        id="modelGrid"
        class="modelGrid"
      >

        <p class="loading">
          Loading models...
        </p>

      </div>

    </section>

  </main>


  <footer>

    <div class="footerLogo">
      MARKETPLACE<span>3D</span>
    </div>

    <p>
      The community marketplace for 3D printable models.
    </p>

  </footer>


  <script src="/portfolio.js"></script>

</body>
</html>
