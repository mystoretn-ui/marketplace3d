<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publier un modèle — Marketplace3D</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="profile-shell"><header class="profile-top"><a class="brand" href="/"><span class="brand-mark">M3</span><span>Marketplace3D</span></a><div class="top-actions"><a href="/" class="login-btn">Accueil</a></div></header><main class="upload-page"><div class="section-head"><div><h1>Publier un modèle</h1><p>Ajoutez votre fichier et choisissez s'il est gratuit ou payant.</p></div></div><form id="uploadForm" class="upload-form" enctype="multipart/form-data"><label>Titre<input name="title" required maxlength="120"></label><div class="form-row"><label>Catégorie<select name="category"><option>Home & Decor</option><option>Car Parts</option><option>Art</option><option>Décor</option><option>Outils</option><option>Jouets & Jeux</option><option>Loisirs & DIY</option><option>Imprimante 3D</option></select></label><label>Prix USD<input name="price" type="number" min="0" step="0.01" value="0"></label></div><label>Description<textarea name="description" rows="6" required></textarea></label><label>Tags<input name="tags" placeholder="car, support, fdm"></label><label>Miniature (image)<input type="file" name="thumbnail" accept="image/*"></label><label>Fichier 3D <span class="muted">(STL, OBJ, 3MF, ZIP, STEP, STP)</span><input type="file" name="modelFile" required></label><div class="commission-note"><b>Commission Marketplace3D : 19%</b><span>Vous recevez 81% du prix d'une vente.</span></div><button class="primary-btn">Publier le modèle</button><div id="uploadMsg" class="form-msg"></div></form></main></div><script src="/js/upload.js"></script></body></html>
